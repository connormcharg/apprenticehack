<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}5-9 Planner — life after work{% endblock %}</title>
<meta name="description" content="A 5-9 life planner for apprentices: goals, household, study and rest without burnout.">
<meta name="theme-color" content="#14101f">
{% load static %}
<link rel="stylesheet" href="{% static 'fivenine/style.css' %}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="{% static 'fivenine/icons/icon.svg' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'fivenine/icons/icon-192.png' %}">
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'fivenine/icons/icon-512.png' %}">
<link rel="apple-touch-icon" href="{% static 'fivenine/icons/icon-192.png' %}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5-9 Planner">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="{% url 'dashboard' %}">5-9</a>
    <nav>
      {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Home</a>
      <a href="{% url 'evening_plan' %}">Plan</a>
      <a href="{% url 'goal_list' %}">Goals</a>
      <a href="{% url 'event_list' %}">Community</a>
      <a href="{% url 'calendar' %}">Calendar</a>
      <a href="{% url 'logout' %}" onclick="event.preventDefault();document.getElementById('logout-form').submit();">Out ({{ user.username }})</a>
      {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
    {% if user.is_authenticated %}
    <button class="ask-btn" type="button" onclick="document.getElementById('chat-fab').click()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg> Ask AI</button>
    {% endif %}
  </div>
</header>
<form id="logout-form" method="post" action="{% url 'logout' %}" style="display:none">{% csrf_token %}</form>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<button id="chat-fab" aria-label="Open assistant"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg></button>
<div id="chat-panel" hidden>
  <div class="chat-panel-head"><strong>5-9 buddy</strong><button id="chat-close" aria-label="Close">✕</button></div>
  <div id="chat-mini-log" class="chat-log mini"></div>
  <form id="chat-mini-form" class="chat-form"><input id="chat-mini-input" type="text" placeholder="Ask…" autocomplete="off"><button type="submit">➤</button></form>
</div>
<script>
/* Shared safe mini-markdown for bot replies: escape HTML, then bold/italic/code/lists. */
window.renderChatMarkdown = function (src) {
  const esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  const lines = esc.split('\n');
  let html = '', list = null;
  const close = () => { if (list) { html += list === 'ul' ? '</ul>' : '</ol>'; list = null; } };
  for (const line of lines) {
    const t = line.trim();
    const ul = t.match(/^[-*]\s+(.*)/);
    const ol = t.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const kind = ul ? 'ul' : 'ol';
      if (list !== kind) { close(); html += kind === 'ul' ? '<ul>' : '<ol>'; list = kind; }
      html += '<li>' + inline((ul || ol)[1]) + '</li>';
    } else if (!t) { close(); }
    else { close(); html += '<p>' + inline(t) + '</p>'; }
  }
  close();
  return html;
};
</script>
<script>
(function () {
  const fab = document.getElementById('chat-fab');
  const panel = document.getElementById('chat-panel');
  const close = document.getElementById('chat-close');
  const log = document.getElementById('chat-mini-log');
  const form = document.getElementById('chat-mini-form');
  const input = document.getElementById('chat-mini-input');
  let greeted = false;
  fab.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    if (!panel.hidden && !greeted) {
      greeted = true;
      const d = document.createElement('div');
      d.className = 'chat-msg bot';
      d.textContent = 'Hey! How much time and energy have you got tonight?';
      log.appendChild(d);
    }
  });
  close.addEventListener('click', () => { panel.hidden = true; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    const u = document.createElement('div');
    u.className = 'chat-msg user';
    u.textContent = v;
    log.appendChild(u);
    input.value = '';
    try {
      const res = await fetch('/api/chat/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: v }) });
      const data = await res.json();
      const b = document.createElement('div');
      b.className = 'chat-msg bot';
      b.innerHTML = window.renderChatMarkdown(data.reply || 'Hmm, try again.');
      log.appendChild(b);
    } catch {
      const b = document.createElement('div');
      b.className = 'chat-msg bot';
      b.textContent = 'Network hiccup — try again.';
      log.appendChild(b);
    }
    log.scrollTop = log.scrollHeight;
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
