{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141718" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Onboarding for apprentices — tell us who you are and what you work with.">
    <title>{% block title %}Life 5-9{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'fivenine/icons/icon-192.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'fivenine/icons/icon-512.png' %}">
    <link rel="apple-touch-icon" href="{% static 'fivenine/icons/icon-192.png' %}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Life 5-9">
    <link rel="stylesheet" href="{% static 'onboarding/css/onboarding.css' %}">
    <script>document.documentElement.classList.add('js');</script>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="page">
      <header class="page__header">
        <a class="brand" href="{% url 'home' %}">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M13.6 2 4.8 13.4h5.3L9.2 22l9.6-11.9h-5.9L13.6 2Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand__name">Life 5-9</span>
        </a>
        {% if user.is_authenticated %}
          <form class="signout" method="post" action="{% url 'onboarding:sign_out' %}">
            {% csrf_token %}
            <button type="submit" class="signout__button">Sign out</button>
          </form>
        {% endif %}
      </header>

      <main class="page__main" id="main">
        {% block content %}{% endblock %}
      </main>

      <footer class="page__footer">
        <p>{% block footer_note %}Built by apprentices, for apprentices.{% endblock %}</p>
      </footer>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
      document.querySelectorAll('form[action$="/sign-out/"]').forEach((form) => {
        form.addEventListener('submit', () => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
          }
        });
      });
    }
    </script>
  </body>
</html>
